name: Build Scout Cam APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true; gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ScoutCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScoutCam
          path: ScoutCam.apk

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" ScoutCam.apk \
            --title "Scout Cam $TAG" \
            --notes "Tap **ScoutCam.apk** below to download, then open it to install." \
            --latest

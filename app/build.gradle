plugins {
    id 'com.android.application'
}

android {
    namespace 'com.premsagar.scoutcam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.premsagar.scoutcam'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '2.0'
    }

    // Fixed signing key kept in the repo, so new versions install over old ones.
    signingConfigs {
        scout {
            storeFile file('scoutcam.keystore')
            storePassword 'scoutcam'
            keyAlias 'scoutcam'
            keyPassword 'scoutcam'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.scout
        }
        debug {
            signingConfig signingConfigs.scout
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def camerax = '1.3.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
